services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hemline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hemline}
      POSTGRES_DB: ${POSTGRES_DB:-hemline}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hemline}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hemline}:${POSTGRES_PASSWORD:-hemline}@postgres:5432/${POSTGRES_DB:-hemline}
    ports:
      - '3000:3000'
    volumes:
      - backend-storage:/app/apps/backend/storage

volumes:
  postgres-data:
  backend-storage:
