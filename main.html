<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hemline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      width: 400px;
      padding: 16px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <h2 class="h5 mb-3">Tailor Resume</h2>
    <p id="jobTitle" class="text-muted mb-3">Loading job title...</p>
    <div class="mb-3">
      <label for="jobDescription" class="form-label">Job Description</label>
      <textarea class="form-control" id="jobDescription" rows="6"
        placeholder="Paste the job description here..."></textarea>
    </div>
    <button type="submit" id="tailorButton" class="btn btn-primary w-100">
      Tailor Resume to This Role
    </button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="./dist/popup.js"></script>
</body>

</html>
